services:
  db:
    image: postgres:15
    command: ["postgres", "-c", "max_connections=1000"]  # to increase max_connections
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: asyncz
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password123@db:5432/asyncz
      - REDIS_URL=redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "arq", "app.worker.WorkerSettings"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password123@db:5432/asyncz
      - REDIS_URL=redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # NEW: Added k6 directly to docker-compose so it is guaranteed 
  # to be on the exact same network as your API.
  k6:
    image: grafana/k6
    volumes:
      - ./tests:/tests
    depends_on:
      - api
